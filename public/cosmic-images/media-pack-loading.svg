<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Preparing website visuals</title>
  <description id="description">Animated placeholder shown while website-specific images are prepared.</description>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.5" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="42%">
      <stop offset="0" stop-color="#10b981" stop-opacity=".16"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <g transform="translate(800 500)" filter="url(#shadow)">
    <rect x="-235" y="-122" width="470" height="244" rx="32" fill="#ffffff" fill-opacity=".92" stroke="#cbd5e1"/>
    <g transform="translate(0 -28)">
      <circle r="42" fill="none" stroke="#d1fae5" stroke-width="10"/>
      <path d="M0-42a42 42 0 0 1 42 42" fill="none" stroke="#059669" stroke-width="10" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
      </path>
      <path d="M-15 4l10 10 22-26" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
    </g>
    <text x="0" y="58" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="29" font-weight="700" fill="#0f172a">Preparing visuals</text>
    <text x="0" y="91" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#64748b">Finding the best images for your website…</text>
  </g>
</svg>
